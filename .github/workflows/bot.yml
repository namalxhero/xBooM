name: xBooM Bot

on:
  workflow_dispatch:

# Only one bot instance at a time
concurrency:
  group: xboom-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore session
        uses: actions/cache/restore@v4
        with:
          path: auth
          key: auth-none
          restore-keys: auth-

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Run bot (max 5h45m)
        id: bot
        env:
          PHONE: ${{ secrets.PHONE }}
          OWNER: ${{ secrets.OWNER }}
        run: |
          set +e
          timeout 345m node index.js
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: auth
          key: auth-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Logged out - clear saved session
        if: steps.bot.outputs.code == '42'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --all || true

      - name: Restart for next cycle
        if: steps.bot.outputs.code != '42'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "$GITHUB_REPOSITORY"
